    <body>
      <header>
        <h1>Create a New Entry</h1>
      </header>
<main>
<form id="entryForm">
    <input id="entryTitle" type="text" placeholder="Entry Title"> <!--ID added so JS can target this input-->
    <textarea id="entryBody" placeholder="Write your reflection..."></textarea>  <!--ID added so JS can read the text from the text area-->
    <button id="saveEntryButton" type="button">Save Entry</button> <!--ID added so JS can detect when the user clicks save-->
</form>
</main>
