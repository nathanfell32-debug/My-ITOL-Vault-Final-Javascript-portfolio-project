<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My ITOL vault javascript Project</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .grid-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 20px;
            }
            .card {
                border: 1px solid #ccc;
                padding: 20px;
                background: #f9f9f9;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>My ITOL vault</h1>
            <nav>
                <a href="new-entry.html">
                    <button>Create New Entry</button>
                </a>
                <!--Profile icon here-->
                <a href="vault.html">
                    <img src="https://via.placeholder.com/40" alt="Profile" width="40">
                </a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Welcome</h2>
                <p>Your personal vault for storing reflections</p>
            </section>
            <!-- JavaScript will generate vault entry cards inside this grid -->
            <section class="grid-container" id="entryGrid"></section>
        </main>

        <footer>
            <p>&copy; 2026 My ITOL Vault</p>
        </footer>
        <!-- JavaScript responsible for displaying saved vault entries-->
        <script src="index.js"></script>
    </body>
</html>
